<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Surprise ❤️</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Georgia, "Times New Roman", serif;

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(255,255,255,0.95),
            transparent 25%
        ),
        radial-gradient(
            circle at 85% 85%,
            rgba(255,255,255,0.8),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #ffffff 0%,
            #eaf4ff 30%,
            #c8d5e5 65%,
            #ffffff 100%
        );

    color: #163452;
    overflow-x: hidden;
}

/* =========================================================
   GENERAL
========================================================= */

#app {
    min-height: 100vh;
    width: 100%;
}

.screen {
    min-height: 100vh;
    width: 100%;

    display: none;

    justify-content: center;
    align-items: center;

    padding: 30px 18px;

    animation: fadeIn 0.45s ease;
}

.screen.active {
    display: flex;
}

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.card {
    width: min(760px, 94vw);

    padding: 45px;

    background: rgba(255,255,255,0.94);

    border: 1px solid rgba(120,135,150,0.45);

    border-radius: 28px;

    text-align: center;

    box-shadow:
        0 25px 65px rgba(20,65,110,0.23),
        inset 0 1px 0 rgba(255,255,255,1);

    backdrop-filter: blur(12px);
}

.card.wide {
    width: min(900px, 95vw);
}

h1 {
    color: #0d47a1;

    font-size:
        clamp(2rem, 5vw, 3.5rem);

    line-height: 1.2;

    margin-bottom: 25px;
}

h2 {
    color: #173f70;

    font-size:
        clamp(1.45rem, 3.5vw, 2.3rem);

    line-height: 1.4;

    margin-bottom: 28px;
}

.subtitle {
    color: #53677b;

    font-size: 1.2rem;

    line-height: 1.7;

    margin-bottom: 25px;
}

.heart {
    color: #e6395b;
}

.sparkles {
    color: #8c98a5;

    font-size: 2rem;

    letter-spacing: 8px;

    margin-bottom: 25px;
}

.question-number {
    color: #758392;

    font-family: Arial, sans-serif;

    font-size: 0.95rem;

    font-weight: bold;

    text-transform: uppercase;

    letter-spacing: 2px;

    margin-bottom: 14px;
}

/* =========================================================
   BUTTONS
========================================================= */

.buttons {
    display: flex;

    justify-content: center;

    align-items: center;

    flex-wrap: wrap;

    gap: 18px;

    margin-top: 30px;
}

.main-btn {
    min-width: 150px;

    padding: 15px 28px;

    border: none;

    border-radius: 50px;

    font-family: Arial, sans-serif;

    font-size: 1rem;

    font-weight: bold;

    color: white;

    background:
        linear-gradient(
            135deg,
            #0d47a1,
            #3d7fc7
        );

    box-shadow:
        0 8px 18px rgba(13,71,161,0.28);

    cursor: pointer;

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}

.main-btn:hover {
    transform: translateY(-3px);

    box-shadow:
        0 12px 25px rgba(13,71,161,0.35);
}

.silver-btn {
    background:
        linear-gradient(
            135deg,
            #727d89,
            #c5cbd2,
            #747e8a
        );
}

/* =========================================================
   QUESTIONS
========================================================= */

.choice-container {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 15px;

    margin-top: 30px;
}

.choice {
    width: 100%;

    padding: 18px 20px;

    text-align: left;

    border-radius: 16px;

    border: 1px solid #b9c5d2;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #edf5ff
        );

    color: #1b3655;

    font-size: 1rem;

    line-height: 1.45;

    cursor: pointer;

    box-shadow:
        0 5px 12px rgba(50,80,110,0.09);

    transition:
        transform 0.2s ease,
        background 0.2s ease,
        border 0.2s ease;
}

.choice:hover {
    transform: translateY(-3px);

    border-color: #3578c7;

    background:
        linear-gradient(
            135deg,
            #f8fbff,
            #dcecff
        );
}

/* =========================================================
   WRONG CHOICE
========================================================= */

.wrong {
    color: #9b2346;

    font-size: 2.7rem;

    margin-bottom: 25px;
}

/* =========================================================
   FINAL QUESTION
========================================================= */

/*
   IMPORTANT:

   The final screen itself does NOT have overflow:hidden.
   This prevents the floating No button from being clipped.
*/

#screen-final {
    position: relative;

    overflow: visible;
}

.final-title {
    color: #0d47a1;

    font-size:
        clamp(2.2rem, 7vw, 4.5rem);

    line-height: 1.2;

    margin-bottom: 35px;

    text-shadow:
        2px 2px 0 #d4d9df;
}

/*
===========================================================
THE FLOATING NO BUTTON
===========================================================

This button is position:fixed.

That means it belongs to the browser viewport,
NOT to the card.

It therefore cannot be pushed out of the card
or hidden by the card layout.
*/

#floatingNoButton {

    position: fixed;

    z-index: 999999;

    display: none;

    min-width: 150px;

    padding: 15px 28px;

    border: none;

    border-radius: 50px;

    font-family: Arial, sans-serif;

    font-size: 1rem;

    font-weight: bold;

    color: white;

    background:
        linear-gradient(
            135deg,
            #727d89,
            #c5cbd2,
            #747e8a
        );

    box-shadow:
        0 10px 25px rgba(30,50,70,0.35);

    cursor: pointer;

    user-select: none;

    -webkit-user-select: none;

    transition:
        left 0.22s ease,
        top 0.22s ease,
        transform 0.22s ease;
}

/*
   It is visible only on the final question.
*/

#floatingNoButton.visible {
    display: block;
}

/*
   Little movement animation.
*/

#floatingNoButton.moving {
    transform: scale(1.08) rotate(2deg);
}

/* =========================================================
   CALENDAR
========================================================= */

.calendar-wrapper {
    margin-top: 25px;
}

.calendar-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 18px;

    padding: 15px 20px;

    border-radius: 16px;

    color: white;

    background:
        linear-gradient(
            135deg,
            #0d47a1,
            #557eaf
        );
}

.calendar-header h3 {
    font-family: Arial, sans-serif;

    font-size: 1.25rem;
}

.calendar-nav {
    width: 40px;

    height: 40px;

    border: none;

    border-radius: 50%;

    color: white;

    background:
        rgba(255,255,255,0.18);

    font-size: 1.3rem;

    cursor: pointer;
}

.calendar-nav:hover {
    background:
        rgba(255,255,255,0.35);
}

.calendar-days,
.calendar-grid {

    display: grid;

    grid-template-columns:
        repeat(7, 1fr);

    gap: 7px;
}

.calendar-days div {

    padding: 8px 2px;

    color: #667586;

    font-family: Arial, sans-serif;

    font-size: 0.8rem;

    font-weight: bold;
}

.date-btn {

    min-height: 48px;

    border-radius: 12px;

    border: 1px solid #d0d8e2;

    color: #1c426c;

    background: #f7fbff;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s ease;
}

.date-btn:hover {

    background: #dcecff;

    border-color: #3578c7;

    transform: scale(1.04);
}

.date-btn.selected {

    color: white;

    background:
        linear-gradient(
            135deg,
            #0d47a1,
            #5890d0
        );

    border-color: #0d47a1;

    box-shadow:
        0 6px 15px rgba(13,71,161,0.3);
}

.empty-date {
    min-height: 48px;
}

.selected-date {

    min-height: 25px;

    margin-top: 18px;

    color: #526579;

    font-family: Arial, sans-serif;
}

/* =========================================================
   OUTFITS
========================================================= */

.outfit-options {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 18px;

    margin-top: 30px;
}

.outfit {

    min-height: 115px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 12px;

    border: 2px solid transparent;

    border-radius: 20px;

    background: #f5f7fa;

    color: #23374d;

    font-family: Arial, sans-serif;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 8px 18px rgba(30,60,90,0.1);

    transition: 0.2s ease;
}

.outfit:hover {

    transform: translateY(-4px);

    border-color: #3578c7;
}

.color-dots {

    display: flex;

    gap: 8px;
}

.dot {

    width: 28px;

    height: 28px;

    border-radius: 50%;

    border: 2px solid rgba(0,0,0,0.15);
}

.black {
    background: #111111;
}

.red {
    background: #c62828;
}

.blue {
    background: #1976d2;
}

.white {
    background: #ffffff;
}

.beige {
    background: #d8c3a5;
}

.purple {
    background: #7b4b9b;
}

/* =========================================================
   FINAL CELEBRATION
========================================================= */

.celebration {

    position: relative;

    overflow: hidden;
}

.party-popper {

    position: absolute;

    font-size: 2.2rem;

    animation:
        popper 1.5s ease-in-out infinite alternate;
}

.pop1 {
    left: 8%;
    top: 10%;
}

.pop2 {
    right: 8%;
    top: 15%;

    animation-delay: 0.3s;
}

.pop3 {
    left: 15%;
    bottom: 12%;

    animation-delay: 0.6s;
}

.pop4 {
    right: 15%;
    bottom: 10%;

    animation-delay: 0.9s;
}

@keyframes popper {

    from {
        transform:
            rotate(-12deg)
            scale(0.9);
    }

    to {
        transform:
            rotate(12deg)
            scale(1.15);
    }
}

.love-message {

    color: #0d47a1;

    font-size:
        clamp(2rem, 6vw, 4rem);

    line-height: 1.25;

    margin-bottom: 25px;
}

.love-sub {

    color: #5e6d7d;

    font-size: 1.5rem;
}

.tiny-note {

    margin-top: 25px;

    color: #788594;

    font-family: Arial, sans-serif;

    font-size: 0.85rem;
}

/* =========================================================
   CONFETTI
========================================================= */

.confetti {

    position: fixed;

    width: 9px;

    height: 16px;

    top: -30px;

    z-index: 1000000;

    animation:
        fall linear forwards;
}

@keyframes fall {

    to {
        transform:
            translateY(110vh)
            rotate(720deg);
    }
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 650px) {

    .card {

        padding: 30px 20px;

        border-radius: 22px;
    }

    .choice-container {

        grid-template-columns: 1fr;
    }

    .outfit-options {

        grid-template-columns: 1fr;
    }

    .calendar-days,
    .calendar-grid {

        gap: 4px;
    }

    .date-btn,
    .empty-date {

        min-height: 42px;
    }

    .date-btn {

        font-size: 0.8rem;
    }

    #floatingNoButton {

        min-width: 125px;

        padding: 13px 20px;

        font-size: 0.9rem;
    }
}

</style>
</head>


<body>

<div id="app">

<!-- =======================================================
     START
======================================================= -->

<section class="screen active" id="screen-start">

    <div class="card">

        <div class="sparkles">
            ✦ ✧ ✦
        </div>

        <h1>
            Hi there! Are you ready for a game? 😏❤️
        </h1>

        <div class="buttons">

            <button
                class="main-btn"
                onclick="showScreen('screen-warning')"
            >
                Yes ❤️
            </button>

            <button
                class="main-btn silver-btn"
                onclick="showScreen('screen-wrong')"
            >
                No
            </button>

        </div>

    </div>

</section>


<!-- =======================================================
     WRONG CHOICE
======================================================= -->

<section class="screen" id="screen-wrong">

    <div class="card">

        <div class="wrong">
            Wrong Choice
        </div>

        <p class="subtitle">
            Hmm… let's try
