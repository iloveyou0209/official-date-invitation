<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap');

:root {
  --pink: #ff4f91;
  --hot-pink: #ff2f75;
  --rose: #ff8eae;
  --purple: #a855f7;
  --deep-purple: #160018;
  --wine: #35001f;
  --gold: #ffd98a;
  --cream: #fff5f7;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100vh;
  color: white;
  font-family: "DM Sans", sans-serif;
  overflow-x: hidden;

  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(255, 65, 130, 0.30),
      transparent 25%
    ),
    radial-gradient(
      circle at 90% 15%,
      rgba(155, 70, 255, 0.30),
      transparent 28%
    ),
    radial-gradient(
      circle at 50% 100%,
      rgba(255, 0, 95, 0.22),
      transparent 35%
    ),
    linear-gradient(
      135deg,
      #0b0012 0%,
      #1a001d 30%,
      #32001f 65%,
      #100018 100%
    );

  position: relative;
}

/* ==========================================================
   ANIMATED BACKGROUND
========================================================== */

body::before {
  content: "";
  position: fixed;
  inset: -30%;
  z-index: 0;
  pointer-events: none;

  background:
    radial-gradient(
      circle at 30% 40%,
      rgba(255, 44, 112, 0.12),
      transparent 25%
    ),
    radial-gradient(
      circle at 70% 60%,
      rgba(135, 55, 255, 0.12),
      transparent 25%
    );

  animation: backgroundGlow 16s ease-in-out infinite alternate;
}

@keyframes backgroundGlow {
  0% {
    transform: translate(-5%, -3%) scale(1);
  }

  50% {
    transform: translate(5%, 4%) scale(1.08);
  }

  100% {
    transform: translate(-2%, 7%) scale(1.15);
  }
}

/* ==========================================================
   STARS
========================================================== */

.sparkle-container {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  overflow: hidden;
}

.sparkle {
  position: absolute;
  color: #fff;
  opacity: 0;
  font-size: 12px;

  text-shadow:
    0 0 5px white,
    0 0 12px #ff79a9,
    0 0 22px #ff3f83;

  animation: starFloat linear infinite;
}

@keyframes starFloat {

  0% {
    opacity: 0;
    transform:
      translateY(30px)
      scale(0.4)
      rotate(0deg);
  }

  20% {
    opacity: 1;
  }

  50% {
    opacity: 0.8;
    transform:
      translateY(-35vh)
      scale(1.2)
      rotate(180deg);
  }

  80% {
    opacity: 0.8;
  }

  100% {
    opacity: 0;
    transform:
      translateY(-100vh)
      scale(0.3)
      rotate(360deg);
  }
}

/* ==========================================================
   MAIN CONTAINER
========================================================== */

.app {
  min-height: 100vh;
  position: relative;
  z-index: 2;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 35px 20px;
}

/* ==========================================================
   MAIN GLASS CARD
========================================================== */

.screen {
  width: min(920px, 100%);
  min-height: 600px;

  padding: 65px 55px;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  text-align: center;

  position: relative;

  border-radius: 38px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,0.13),
      rgba(255,255,255,0.045)
    );

  border: 1px solid rgba(255,255,255,0.20);

  box-shadow:
    0 30px 100px rgba(0,0,0,0.60),
    0 0 80px rgba(255,55,125,0.10),
    inset 0 1px 0 rgba(255,255,255,0.15);

  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);

  animation: cardEntrance 0.7s cubic-bezier(.2,.8,.2,1);
}

.screen::before {
  content: "";

  position: absolute;
  inset: 1px;

  border-radius: 37px;

  pointer-events: none;

  background:
    linear-gradient(
      120deg,
      rgba(255,255,255,0.07),
      transparent 35%,
      transparent 65%,
      rgba(255,120,170,0.05)
    );
}

@keyframes cardEntrance {

  from {
    opacity: 0;
    transform:
      translateY(35px)
      scale(0.94);
    filter: blur(4px);
  }

  to {
    opacity: 1;
    transform:
      translateY(0)
      scale(1);
    filter: blur(0);
  }
}

/* ==========================================================
   DECORATIVE CORNERS
========================================================== */

.screen::after {
  content: "✦";

  position: absolute;

  top: 22px;
  right: 28px;

  color: #ffd3e3;

  font-size: 25px;

  text-shadow:
    0 0 8px white,
    0 0 20px #ff4f91;

  animation: twinkle 1.8s ease-in-out infinite alternate;
}

@keyframes twinkle {

  from {
    opacity: 0.25;
    transform: scale(0.7) rotate(0deg);
  }

  to {
    opacity: 1;
    transform: scale(1.3) rotate(30deg);
  }
}

/* ==========================================================
   TYPOGRAPHY
========================================================== */

h2,
h3 {
  font-family: "Cormorant Garamond", serif;
}

h1 {

  font-size: clamp(3rem, 7vw, 5.2rem);

  line-height: 0.98;

  font-weight: 600;

  letter-spacing: -1px;

  color: #fff8fb;

  text-shadow:
    0 2px 20px rgba(255,65,130,0.35),

}

h2 {

  line-height: 1.15;

  font-weight: 600;

  color: #fff7fa;

  text-shadow:
    0 0 25px rgba(255,100,160,0.18);
}

h3 {

}

.subtitle {

}

.warning {

  color: #ffd5e3;

  font-size: 1.25rem;

  line-height: 1.8;
}

/* ==========================================================
   SCRIPT-STYLE ACCENT
========================================================== */

.big-heart {
  margin-bottom: 15px;

  font-size: 5rem;

  filter:
    drop-shadow(0 0 10px rgba(255,50,110,0.8))

}

@keyframes heartBeat {

  }

  15% {
    transform: scale(1.16);
  }

  30% {

  45% {

  }

========================================================== */

.question-number {

}

/* ==========================================================
   FINAL DATE QUESTION
========================================================== */

.final-question {

  width: 100%;

  padding: 15px;

  position: relative;
}

.final-question h1 {

  font-size: clamp(3.5rem, 9vw, 6.5rem);

      135deg,

  text-shadow: none;
}

@keyframes gradientText {

  0% {

  }

  50% {
    background-position: 100% 50%;
  }

  100% {
    background-position: 0% 50%;
  }
}

/* ==========================================================
   FINAL YES / NO AREA
========================================================== */

.final-buttons {

  position: relative;

  width: min(760px, 100%);

  height: 210px;

  margin-top: 15px;

.final-buttons button {

  position: absolute;

  top: 65px;
}

}

   BACK BUTTON
========================================================== */

.back-button {

  position: absolute;

  bottom: 20px;
  left: 25px;

  padding: 9px 18px;

  font-size: 0.82rem;

  color: #ffdce8;

}

  box-shadow:

}

  width: 100%;

  max-width: 780px;
}

.calendar-months {

  grid-template-columns: repeat(2, 1fr);

  gap: 22px;

  width: 100%;
}

.month {

  padding: 23px;

  border-radius: 25px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,0.09),
      rgba(255,255,255,0.035)
    );

  border:
    1px solid rgba(255,255,255,0.13);

  box-shadow:
    0 15px 40px rgba(0,0,0,0.18);
}

.month h3 {

  margin: 0 0 18px;

  text-shadow:

.days {

.weekday {

}

.day {

.day.selected {

      135deg,

    );

  box-shadow:
    0 0 20px rgba(255,50,130,0.45);

.day.empty {

}

.selected-date {

  margin-top: 20px;

  min-height: 28px;

  color: #ffd6e5;

  font-size: 1.05rem;

  text-shadow:
    0 0 15px rgba(255,70,140,0.2);
}

  padding: 22px;

  display: flex;

  flex-direction: column;

  justify-content: center;

  align-items: center;

  cursor: pointer;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,0.09),
      rgba(255,255,255,0.035)
    );

  border:
    1px solid rgba(255,255,255,0.13);

  transition:

}

}

}

.black {
  background: #050505;
}

.red {
  background: #e63946;
}

.blue {

}

.white {

}

}

}
