<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Very Important Question ❤️</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #fff4f7 0%,
            #ffe5ed 45%,
            #ffd5e1 100%
        );

    color: #43232f;
    min-height: 100vh;
    overflow-x: hidden;
}

/* =========================================
   MUSIC BUTTON
========================================= */

#musicButton {
    position: fixed;
    top: 15px;
    right: 15px;

    z-index: 9999;

    width: auto;

    padding: 10px 15px;

    border-radius: 30px;

    border: 1px solid #efd1dc;

    background: rgba(255,255,255,0.92);

    color: #7b2849;

    font-size: 14px;
    font-weight: 700;

    box-shadow:
        0 5px 20px rgba(100,30,50,0.12);

    cursor: pointer;
}

/* =========================================
   FLOATING HEARTS
========================================= */

.heart {
    position: fixed;

    bottom: -50px;

    pointer-events: none;

    opacity: 0;

    z-index: 0;

    animation:
        floatHeart linear infinite;
}

@keyframes floatHeart {

    0% {
        transform:
            translateY(0)
            rotate(0deg);

        opacity: 0;
    }

    15% {
        opacity: 0.25;
    }

    85% {
        opacity: 0.25;
    }

    100% {
        transform:
            translateY(-110vh)
            rotate(360deg);

        opacity: 0;
    }
}

/* =========================================
   MAIN APP
========================================= */

.app {
    position: relative;

    z-index: 2;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 25px 15px;
}

.card {
    width: min(680px, 100%);

    background:
        rgba(255,255,255,0.94);

    border-radius: 28px;

    padding: 45px 35px;

    text-align: center;

    box-shadow:
        0 20px 70px
        rgba(126,40,70,0.16);

    backdrop-filter: blur(10px);

    animation: cardAppear 0.5s ease;
}

@keyframes cardAppear {

    from {
        opacity: 0;

        transform:
            translateY(20px)
            scale(0.97);
    }

    to {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}

/* =========================================
   TEXT
========================================= */

.emoji {
    font-size: 55px;

    margin-bottom: 15px;
}

h1 {
    margin: 0 0 18px;

    color: #8d2148;

    font-size:
        clamp(28px, 7vw, 43px);

    line-height: 1.2;
}

h2 {
    margin: 0 0 25px;

    color: #6d2441;

    font-size:
        clamp(22px, 5vw, 31px);

    line-height: 1.4;
}

p {
    font-size: 18px;

    line-height: 1.6;

    color: #61414d;
}

/* =========================================
   BUTTONS
========================================= */

.buttons {
    display: flex;

    justify-content: center;

    align-items: center;

    gap: 15px;

    flex-wrap: wrap;

    margin-top: 30px;
}

button {
    border: none;

    border-radius: 15px;

    padding: 14px 25px;

    font-size: 17px;

    font-weight: 700;

    cursor: pointer;

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
}

button:hover {
    transform: translateY(-2px);
}

.primary {
    background:
        linear-gradient(
            135deg,
            #dc3b70,
            #a91e50
        );

    color: white;

    box-shadow:
        0 8px 22px
        rgba(190,38,91,0.25);
}

.primary:hover {
    box-shadow:
        0 12px 28px
        rgba(190,38,91,0.35);
}

.secondary {
    background: #f5e7ed;

    color: #71354b;
}

.yes-button {
    background:
        linear-gradient(
            135deg,
            #ff5083,
            #d51e58
        );

    color: white;

    font-size: 20px;

    padding:
        16px 35px;

    box-shadow:
        0 10px 25px
        rgba(213,30,88,0.25);
}

/* =========================================
   WARNING
========================================= */

.warning {
    background: #fff8df;

    border:
        1px solid #eed98f;

    border-radius: 18px;

    padding: 20px;

    margin: 25px 0;

    color: #67521a;
}

.warning strong {
    color: #795d08;
}

/* =========================================
   PROGRESS BAR
========================================= */

.progress {
    width: 100%;

    height: 7px;

    background: #f3dce4;

    border-radius: 20px;

    overflow: hidden;

    margin-bottom: 30px;
}

.progress-bar {
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #ff6d98,
            #b92359
        );

    border-radius: 20px;

    transition:
        width 0.4s ease;
}

.question-number {
    color: #c03868;

    font-weight: 700;

    font-size: 17px;

    margin-bottom: 12px;
}

/* =========================================
   ANSWERS
========================================= */

.answers {
    display: flex;

    flex-direction: column;

    gap: 13px;

    margin-top: 25px;
}

.answer {
    width: 100%;

    text-align: left;

    background: white;

    border:
        2px solid #efd6df;

    color: #4b3039;

    padding: 17px 20px;

    border-radius: 16px;

    font-size: 16px;

    font-weight: 500;
}

.answer:hover {
    border-color: #d84b77;

    background: #fff5f8;

    transform:
        translateX(5px);
}

/* =========================================
   DATE PICKER
========================================= */

.date-area {
    margin-top: 25px;
}

.date-area label {
    display: block;

    margin-bottom: 10px;

    font-weight: 700;

    color: #6f2341;
}

input[type="date"] {
    width: 100%;

    max-width: 300px;

    padding: 15px;

    border:
        2px solid #efd2dc;

    border-radius: 14px;

    font-size: 17px;

    color: #4c303a;

    background: white;
}

/* =========================================
   OUTFIT OPTIONS
========================================= */

.outfits {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 15px;

    margin-top: 25px;
}

.outfit {
    border:
        2px solid #eed6df;

    border-radius: 18px;

    padding: 22px 12px;

    background: white;

    cursor: pointer;

    transition:
        all 0.2s ease;
}

.outfit:hover {
    transform:
        translateY(-3px);

    border-color: #cf3c6c;

    box-shadow:
        0 8px 20px
        rgba(140,40,70,0.10);
}

.outfit.selected {
    border-color: #d92f68;

    background: #fff1f6;

    box-shadow:
        0 0 0 3px
        rgba(217,47,104,0.12);
}

.color-dots {
    display: flex;

    justify-content: center;

    gap: 8px;

    margin-bottom: 12px;
}

.dot {
    width: 30px;

    height: 30px;

    border-radius: 50%;

    border:
        2px solid #ddd;
}

.black {
    background: #111;
}

.red {
    background: #e63946;
}

.blue {
    background: #3478db;
}

.white {
    background: #fff;
}

.beige {
    background: #d8c2a6;
}

.purple {
    background: #8e5ab7;
}

.outfit-name {
    font-weight: 700;

    color: #57313f;
}

/* =========================================
   FINAL NO BUTTON
========================================= */

#finalNo {
    position: relative;
}

/* =========================================
   CONFETTI
========================================= */

#celebration {
    position: fixed;

    inset: 0;

    pointer-events: none;

    overflow: hidden;

    z-index: 10000;
}

.confetti {
    position: absolute;

    top: -30px;

    width: 10px;

    height: 17px;

    animation:
        confettiFall 3s linear forwards;
}

@keyframes confettiFall {

    from {
        transform:
            translateY(0)
            rotate(0deg);
    }

    to {
        transform:
            translateY(110vh)
            rotate(720deg);
    }
}

.final-message {
    font-size:
        clamp(30px, 7vw, 50px);

    color: #bd2559;

    margin-bottom: 15px;
}

.love {
    font-size: 48px;

    margin: 20px 0;
}

/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

    .app {
        padding:
            20px 12px;
    }

    .card {
        padding:
            35px 20px;

        border-radius: 23px;
    }

    .outfits {
        grid-template-columns:
            1fr;
    }

    .buttons {
        flex-direction:
            column;
    }

    .buttons button {
        width: 100%;
    }

    #musicButton {
        top: 10px;
        right: 10px;

        font-size: 12px;

        padding:
            8px 12px;
    }
}

</style>
</head>

<!-- =========================================
     MUSIC
========================================= -->

<audio
    id="backgroundMusic"
    loop
    preload="auto">

    <source
        src="until-i-found-you-instrumental.mp3"
        type="audio/mpeg">

</audio>


<!-- Music control -->

<button
    id="musicButton"
    onclick="toggleMusic()">

    🎵 Music: OFF

</button>


<!-- Background hearts -->

<div id="hearts"></div>


<!-- Main website -->

<main class="app">

    <div
        class="card"
        id="app">

    </div>

</main>


<!-- Celebration -->

<div
    id="celebration">

</div>


<script>

/* =========================================================
   MUSIC
========================================================= */

const backgroundMusic =
    document.getElementById(
        "backgroundMusic"
    );

const musicButton =
    document.getElementById(
        "musicButton"
    );


backgroundMusic.volume = 0.35;


/*
   Try to start music immediately.

   Some browsers allow this.
   Some browsers block audible autoplay.

   If blocked, the first interaction
   with the page starts it.
*/

function startMusic() {

    backgroundMusic
        .play()
        .then(() => {

            musicButton.innerText =
                "🎵 Music: ON";

        })
        .catch(() => {

            musicButton.innerText =
                "🎵 Tap for music";

        });

}


function toggleMusic() {

    if (
        backgroundMusic.paused
    ) {

        backgroundMusic
            .play()
            .then(() => {

                musicButton.innerText =
                    "🎵 Music: ON";

            });

    } else {

        backgroundMusic.pause();

        musicButton.innerText =
            "🎵 Music: OFF";

    }

}


/*
   Try autoplay immediately
*/

window.addEventListener(
    "load",
    () => {

        startMusic();

    }
);


/*
   If browser blocks autoplay,
   start music on first interaction.
*/

document.addEventListener(
    "click",
    () => {

        if (
            backgroundMusic.paused
        ) {

            startMusic();

        }

    },
    {
        once: true
    }
);


/* =========================================================
   BACKGROUND HEARTS
========================================================= */

function createHearts() {

    const container =
        document.getElementById(
            "hearts"
        );

    const hearts = [
        "❤️",
        "💕",
        "💗",
        "💖",
        "♡"
    ];

    for (
        let i = 0;
        i < 25;
        i++
    ) {

        const heart =
            document.createElement(
                "div"
            );

        heart.className =
            "heart";

        heart.innerText =
            hearts[
                Math.floor(
                    Math.random() *
                    hearts.length
                )
            ];

        heart.style.left =
            Math.random() * 100 +
            "%";

        heart.style.animationDuration =
            (8 + Math.random() * 10) +
            "s";

        heart.style.animationDelay =
            Math.random() * 10 +
            "s";

        heart.style.fontSize =
            (15 + Math.random() * 20) +
            "px";

        container.appendChild(
            heart
        );

    }

}

createHearts();


/* =========================================================
   APP
========================================================= */

const app =
    document.getElementById(
        "app"
    );


let selectedDate = "";

let selectedOutfit = "";

let currentQuestion = 0;


/* =========================================================
   QUESTIONS
========================================================= */

const questions = [

    {
        number: 1,

        text:
            "How much do you miss me?",

        answers: [

            "A. A little",

            "B. Quite a bit",

            "C. More than I'd admit",

            "D. Ekdomi na. Why are we even discussing this? 😂"

        ]
    },


    {
        number: 2,

        text:
            "😏 What's the most dangerous thing about going on a date with me?",

        answers: [

            "A. I'll steal your food",

            "B. I'll make you laugh when you're trying to be serious",

            "C. You'll end up not wanting the date to end",

            "D. All of the above, obviously"

        ]
    },


    {
        number: 3,

        text:
            "Wait!! Tell me, what's more dangerous?",

        answers: [

            "A. Me when I'm hungry",

            "B. Me when I'm annoyed",

            "C. Me when I have an idea",

            "D. Me saying “I have a surprise for you” 😏"

        ]
    },


    {
        number: 4,

        text:
            "If I were a food, what would I be?",

        answers: [

            "A. Chocolate 🍫",

            "B. Pizza 🍕",

            "C. Spicy noodles 🌶️",

            "D. Something you can't stop eating 😏"

        ]
    },


    {
        number: 5,

        text:
            "What's one thing you'd like us to do together again?",

        answers: [

            "A. Go somewhere we've been before",

            "B. Try somewhere completely new",

            "C. Stay up talking way too late",

            "D. Make another memory we can laugh about later"

        ]
    },


    {
        number: 6,

        text:
            "I suddenly say, “Let's go somewhere. Don't ask where.” You have 10 minutes to get ready.",

        answers: [

            "A. Absolutely. Let's go.",

            "B. Ask where we're going first.",

            "C. Ask what to wear.",

            "D. Make a 🌿🚬"

        ]
    },


    {
        number: 7,

        text:
            "If you could change ONE thing about our relationship, what would you choose?",

        answers: [

            "A. Less fights",

            "B. More uninterrupted time together",

            "C. More adventures",

            "D. Nothing. I'd rather make more memories from here ❤️"

        ]
    },


    {
        number: 8,

        text:
            "Imagine you have been invited on a date. What kind of date would be hardest to say no to?",

        answers: [

            "A. Dinner somewhere beautiful",

            "B. A movie-night",

            "C. Somewhere neither of you has been before",

            "D. A date where the only plan is to spend time together ❤️"

        ]
    },


    {
        number: 9,

        text:
            "And if I told you the person asking is… me?",

        answers: [

            "A. Of course, it has to be my wife 😒 ugghhh",

            "B. I was wondering when you'd get to the point",

            "C. Let me think about it 😌",

            "D. Where and when?"

        ]
    },


    {
        number: 10,

        text:
            "Would you let me steal you away for an evening?",

        answers: [

            "A. ❤️ Yes — Especially if it's with you.",

            "B. 😏 Yes — But you'll have to convince me.",

            "C. 🙈 No — I'm afraid I'm already a little too interested.",

            "D. 😂 No — This sounds like a terrible idea… let's do it anyway."

        ]
    }

];


/* =========================================================
   PAGE 1
========================================================= */

function showWelcome() {

    app.innerHTML = `

        <div class="emoji">
            😏❤️
        </div>

        <h1>
            Hi there!
        </h1>

        <h2>
            Are you ready for a game? 😏❤️
        </h2>

        <div class="buttons">

            <button
                class="primary"
                onclick="showWarning()">

                Yes 😏

            </button>


            <button
                class="secondary"
                onclick="wrongChoice()">

                No

            </button>

        </div>

    `;

}


/* =========================================================
   NO — WRONG CHOICE
========================================================= */

function wrongChoice() {

    app.innerHTML = `

        <div class="emoji">
            😐
        </div>

        <h1>
            Wrong Choice
        </h1>

        <p>
            That wasn't the answer I was looking for.
        </p>

        <p>
            Please reconsider your life choices. 😂
        </p>

        <div class="buttons">

            <button
                class="primary"
                onclick="showWelcome()">

                Try Again 😌

            </button>

        </div>

    `;

}


/* =========================================================
   WARNING PAGE
========================================================= */

function showWarning() {

    /*
       His click on YES is also the perfect
       opportunity to start the music if the
       browser blocked autoplay.
    */

    startMusic();


    app.innerHTML = `

        <div class="emoji">
            ⚠️
        </div>

        <h1>
            Please proceed with caution.
        </h1>

        <div class="warning">

            <p>
                <strong>
                    Please proceed with caution.
                </strong>
            </p>

            <p>
                Your answers may have consequences.
            </p>

        </div>

        <p>
            Once you begin, there is absolutely
            no turning back.
        </p>

        <p>
            Probably. 😂
        </p>

        <div class="buttons">

            <button
                class="primary"
                onclick="startQuestions()">

                I'm ready 😎

            </button>

        </div>

    `;

}


/* =========================================================
   START QUESTIONS
========================================================= */

function startQuestions() {

    currentQuestion = 0;

    showQuestion();

}


/* =========================================================
   QUESTION PAGE
========================================================= */

function showQuestion() {

    const q =
        questions[
            currentQuestion
        ];


    const progress =
        (
            (currentQuestion + 1)
            /
            questions.length
        ) * 100;


    let answerHTML = "";


    q.answers.forEach(
        (answer, index) => {

            answerHTML += `

                <button
                    class="answer"
                    onclick="nextQuestion(${index})">

                    ${answer}

                </button>

            `;

        }
    );


    app.innerHTML = `

        <div class="progress">

            <div
                class="progress-bar"
                style="width:${progress}%">

            </div>

        </div>


        <div class="question-number">

            Question
            ${q.number}
            of
            ${questions.length}

        </div>


        <h2>
            ${q.text}
        </h2>


        <div class="answers">

            ${answerHTML}

        </div>

    `;

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion(
    answerIndex
) {

    currentQuestion++;


    if (
        currentQuestion
        <
        questions.length
    ) {

        showQuestion();

    } else {

        showFinalIntro();

    }

}


/* =========================================================
   FINAL INTRO
========================================================= */

function showFinalIntro() {

    app.innerHTML = `

        <div class="emoji">
            ❤️
        </div>

        <h1>
            Okay, enough questions. ❤️
        </h1>

        <h2>
            There's only one thing left to ask...
        </h2>

        <div class="buttons">

            <button
                class="primary"
                onclick="showDateQuestion()">

                Continue ❤️

            </button>

        </div>

    `;

}


/* =========================================================
   WILL YOU BE MY DATE?
========================================================= */

function showDateQuestion() {

    app.innerHTML = `

        <div class="emoji">
            ✨❤️✨
        </div>

        <h1>
            Will you be my date? ❤️
        </h1>

        <p>
            Choose carefully.
        </p>

        <div
            class="buttons"
            id="finalButtons">

            <button
                class="yes-button"
                onclick="dateYes()">

                Yes ❤️

            </button>


            <button
                class="secondary"
                id="finalNo">

                No

            </button>

        </div>

    `;


    setupNoButton();

}


/* =========================================================
   ESCAPING NO BUTTON
========================================================= */

function setupNoButton() {

    const noButton =
        document.getElementById(
            "finalNo"
        );


    if (!noButton) return;


    noButton.addEventListener(
        "mouseenter",
        escapeNo
    );


    noButton.addEventListener(
        "touchstart",
        escapeNo
    );


    noButton.addEventListener(
        "click",
        escapeNo
    );

}


function escapeNo() {

    const noButton =
        document.getElementById(
            "finalNo"
        );


    if (!noButton) return;


    const padding = 25;


    const maxX =
        window.innerWidth
        -
        noButton.offsetWidth
        -
        padding;


    const maxY =
        window.innerHeight
        -
        noButton.offsetHeight
        -
        padding;


    const x =
        Math.max(
            padding,
            Math.random() * maxX
        );


    const y =
        Math.max(
            padding,
            Math.random() * maxY
        );


    noButton.style.position =
        "fixed";


    noButton.style.left =
        x + "px";


    noButton.style.top =
        y + "px";


    noButton.style.zIndex =
        "10000";

}


/* =========================================================
   YES
========================================================= */

function dateYes() {

    startMusic();


    app.innerHTML = `

        <div class="emoji">
            🎉❤️
        </div>

        <h1>
            Excellent choice Sir!
        </h1>

        <p>
            I knew you had good taste. 😌
        </p>

        <div class="buttons">

            <button
                class="primary"
                onclick="showDatePicker()">

                Pick our date 📅

            </button>

        </div>

    `;

}


/* =========================================================
   DATE PICKER
========================================================= */

function showDatePicker() {

    app.innerHTML = `

        <div class="emoji">
            📅❤️
        </div>

        <h1>
            Choose our date
        </h1>

        <p>
            Pick a day in August or September 2026.
        </p>


        <div class="date-area">

            <label
                for="datePicker">

                Our date:

            </label>


            <input
                type="date"
                id="datePicker"
                min="2026-08-01"
                max="2026-09-30">

        </div>


        <div class="buttons">

            <button
                class="primary"
                onclick="confirmDate()">

                That's the day ❤️

            </button>

        </div>

    `;

}


/* =========================================================
   CONFIRM DATE
========================================================= */

function confirmDate() {

    const picker =
        document.getElementById(
            "datePicker"
        );


    if (!picker.value) {

        alert(
            "You need to choose a date first! 😌"
        );

        return;

    }


    selectedDate =
        picker.value;


    showOutfits();

}


/* =========================================================
   OUTFIT COLORS
========================================================= */

function showOutfits() {

    app.innerHTML = `

        <div class="emoji">
            👗🕺
        </div>

        <h1>
            Now for the important part.
        </h1>

        <h2>
            Pick a color code for our outfits.
        </h2>


        <div class="outfits">


            <!-- OPTION 1 -->

            <div
                class="outfit"
                onclick="
                    selectOutfit(
                        'Black & Red',
                        this
                    )
                ">

                <div class="color-dots">

                    <span
                        class="dot black">
                    </span>

                    <span
                        class="dot red">
                    </span>

                </div>

                <div class="outfit-name">

                    Option 1<br>

                    Black and Red

                </div>

            </div>


            <!-- OPTION 2 -->

            <div
                class="outfit"
                onclick="
                    selectOutfit(
                        'Blue & White',
                        this
                    )
                ">

                <div class="color-dots">

                    <span
                        class="dot blue">
                    </span>

                    <span
                        class="dot white">
                    </span>

                </div>

                <div class="outfit-name">

                    Option 2<br>

                    Blue and White

                </div>

            </div>


            <!-- OPTION 3 -->

            <div
                class="outfit"
                onclick="
                    selectOutfit(
                        'Beige & Purple',
                        this
                    )
                ">

                <div class="color-dots">

                    <span
                        class="dot beige">
                    </span>

                    <span
                        class="dot purple">
                    </span>

                </div>

                <div class="outfit-name">

                    Option 3<br>

                    Beige and Purple

                </div>

            </div>


            <!-- OPTION 4 -->

            <div
                class="outfit"
                onclick="
                    selectOutfit(
                        'Black & White',
                        this
                    )
                ">

                <div class="color-dots">

                    <span
                        class="dot black">
                    </span>

                    <span
                        class="dot white">
                    </span>

                </div>

                <div class="outfit-name">

                    Option 4<br>

                    Black and White

                </div>

            </div>


        </div>


        <div class="buttons">

            <button
                class="primary"
                onclick="confirmOutfit()">

                Confirm our colors ❤️

            </button>

        </div>

    `;

}


/* =========================================================
   SELECT OUTFIT
========================================================= */

function selectOutfit(
    name,
    element
) {

    selectedOutfit =
        name;


    document
        .querySelectorAll(
            ".outfit"
        )
        .forEach(
            item => {

                item.classList.remove(
                    "selected"
                );

            }
        );


    element.classList.add(
        "selected"
    );

}


/* =========================================================
   CONFIRM OUTFIT
========================================================= */

function confirmOutfit() {

    if (!selectedOutfit) {

        alert(
            "You need to choose our colors first! 😂"
        );

        return;

    }


    showFinalCelebration();

}


/* =========================================================
   FINAL CELEBRATION
========================================================= */

function showFinalCelebration() {

    app.innerHTML = `

        <div class="emoji">
            🎉🥳❤️🎉
        </div>


        <div class="final-message">

            Thank you for your time!

        </div>


        <h2>
            I love you ❤️
        </h2>


        <div class="love">

            🎉 ❤️ 🎊 ❤️ 🎉

        </div>


        <p>

            Date confirmed.

        </p>


        <p>

            <strong>
                ${formatDate(selectedDate)}
            </strong>

        </p>


        <p>

            Outfit:

            <strong>
                ${selectedOutfit}
            </strong>

        </p>


        <p>

            See you on our date, Sir. 😌❤️

        </p>

    `;


    launchConfetti();

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(
    dateString
) {

    const date =
        new Date(
            dateString +
            "T12:00:00"
        );


    return date.toLocaleDateString(
        "en-US",
        {
            weekday: "long",

            year: "numeric",

            month: "long",

            day: "numeric"
        }
    );

}


/* =========================================================
   CONFETTI
========================================================= */

function launchConfetti() {

    const container =
        document.getElementById(
            "celebration"
        );


    const colors = [

        "#ff4f81",

        "#d9366e",

        "#ffd166",

        "#06d6a0",

        "#118ab2",

        "#9b5de5",

        "#ffffff"

    ];


    for (
        let i = 0;
        i < 120;
        i++
    ) {

        const piece =
            document.createElement(
                "div"
            );


        piece.className =
            "confetti";


        piece.style.left =
            Math.random() * 100 +
            "%";


        piece.style.background =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];


        piece.style.animationDelay =
            Math.random() * 1.5 +
            "s";


        piece.style.animationDuration =
            2 +
            Math.random() * 2 +
            "s";


        piece.style.transform =
            `rotate(
                ${Math.random() * 360}deg
            )`;


        container.appendChild(
            piece
        );

    }


    setTimeout(
        () => {

            container.innerHTML =
                "";

        },
        5000
    );

}


/* =========================================================
   START
========================================================= */

showWelcome();

</script>
